<style>
:root{
  --bg:#eef0ea;--surface:#ffffff;--surface-2:#f4f5f0;--line:#e1e5dc;--line-2:#cfd5cb;
  --ink:#14211b;--ink-2:#4a5a51;--ink-3:#8a968f;
  --forest:#153f31;--forest-2:#0b281f;--forest-3:#1f5a45;
  --gold:#b08a45;--gold-2:#e2c68d;--gold-soft:#f6efdf;
  --ivory:#fbf9f3;--chalk:#f3efe3;
  --red:#c8372b;--red-soft:#fbeae7;--good:#1c7a51;--good-soft:#e3f2ea;
  --mild:#c9971d;--medium:#d9661f;--hot:#c8372b;--mild-soft:#fbf3dc;--medium-soft:#fdeadd;--hot-soft:#fbe7e4;
  --silver:#8f9aa3;--bronze:#a86a3d;
  --shadow:0 1px 2px rgba(16,40,30,.05),0 12px 28px -18px rgba(16,40,30,.38);
  --shadow-lg:0 2px 6px rgba(16,40,30,.06),0 30px 60px -30px rgba(16,40,30,.5);
  --f-body:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-serif:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  --f-hand:'Nanum Pen Script',cursive;
  --maxw:520px;--nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1310;--surface:#131d18;--surface-2:#18241e;--line:#24322b;--line-2:#34453c;
  --ink:#e8eee9;--ink-2:#afbdb4;--ink-3:#7c8a82;
  --forest:#123629;--forest-2:#0a211a;--forest-3:#2c7a5d;
  --gold:#d6b16c;--gold-2:#ecd49f;--gold-soft:#2c2616;
  --ivory:#161f1a;--chalk:#f3efe3;
  --red:#ff6b58;--red-soft:#3a1f1a;--good:#4fcf8c;--good-soft:#16321f;
  --mild:#e8bd4f;--medium:#ff9150;--hot:#ff6b58;--mild-soft:#35301a;--medium-soft:#3a2517;--hot-soft:#3a1f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.8);--shadow-lg:0 30px 60px -30px rgba(0,0,0,.9);color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;min-height:100vh;}
[hidden]{display:none!important;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
h1,h2,h3{margin:0;}
.hero h1,.page-h h1,.sec-h h2,.sheet h2{text-wrap:balance;}
p{margin:0;}
.num{font-variant-numeric:tabular-nums;}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.icon.fill{fill:currentColor;stroke:none;}
.h1{--heat:var(--mild);--heat-soft:var(--mild-soft);}.h2{--heat:var(--medium);--heat-soft:var(--medium-soft);}.h3{--heat:var(--hot);--heat-soft:var(--hot-soft);}

#app{max-width:var(--maxw);margin:0 auto;min-height:100vh;position:relative;}
.page{padding:0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));}
.page.nonav{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));}

/* top bar (sub pages) */
.topbar{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);}
.topbar-in{display:flex;align-items:center;gap:6px;height:52px;padding:0 10px;}
.back{width:40px;height:40px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);}
.back:active{background:var(--surface-2);}
.back .icon{width:24px;height:24px;}
.top-title{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-right{font-size:12px;color:var(--ink-3);padding-right:6px;}

/* hero */
.hero{position:relative;margin:0 -16px;padding:calc(22px + env(safe-area-inset-top,0px)) 22px 26px;background:
  radial-gradient(520px 260px at 100% -60px,rgba(226,198,141,.20),transparent 60%),
  radial-gradient(420px 240px at -10% 120%,rgba(46,122,93,.45),transparent 65%),
  linear-gradient(160deg,var(--forest) 0%,var(--forest-2) 100%);color:var(--chalk);overflow:hidden;}
.hero::before{content:"";position:absolute;inset:10px;border:1px solid rgba(226,198,141,.28);border-radius:18px;pointer-events:none;}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,rgba(255,255,255,.018) 0 1px,transparent 1px 6px);pointer-events:none;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1;}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.2em;color:var(--gold-2);opacity:.9;text-transform:uppercase;}
.hero h1{font:700 40px/1.1 var(--f-serif);margin-top:10px;letter-spacing:-.01em;background:linear-gradient(180deg,#fffaf0 30%,#e9d6aa);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero .tag{font:15px/1.5 var(--f-serif);color:var(--gold-2);margin-top:6px;}
.seal{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 35% 30%,#f3dfae,#b08a45 70%);color:#3a2a0c;font:700 17px/1 var(--f-serif);box-shadow:0 6px 16px -6px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.35);margin-top:4px;}
.seal::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px dashed rgba(58,42,12,.45);}
.hero-me{position:relative;z-index:1;margin-top:18px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);}
.hero-me .av{width:34px;height:34px;border-radius:50%;background:var(--gold-2);color:#3a2a0c;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;}
.hero-me b{display:block;font-size:14px;}
.hero-me small{font-size:11.5px;color:rgba(243,239,227,.7);}
.hero-me .pts{margin-left:auto;text-align:right;}
.hero-me .pts b{font:700 22px/1 var(--f-serif);color:var(--gold-2);}
.hero-me .pts small{display:block;margin-top:3px;}
.hero-cta{position:relative;z-index:1;margin-top:14px;}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;transition:transform .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--forest);border-color:var(--forest);color:#fdfaf1;}
.btn-gold{background:linear-gradient(135deg,#e7cc92,#b08a45);border:0;color:#2c1f06;box-shadow:0 10px 24px -12px rgba(176,138,69,.9);}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-2);}
.btn-block{width:100%;}
.btn-lg{padding:15px 18px;font-size:16px;border-radius:16px;}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:10px;}
.btn-danger{color:var(--red);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* sections */
.sec{margin-top:22px;}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
.sec-h h2{font:700 18px/1.3 var(--f-serif);}
.sec-h button,.sec-h a{background:none;border:0;padding:0;font-size:13px;font-weight:700;color:var(--gold);text-decoration:none;}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:8px;line-height:1.5;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}
.pad{padding:16px;}

/* resume */
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;padding:13px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--heat) 45%,transparent);background:var(--heat-soft);color:var(--ink);}
.resume .ri{width:38px;height:38px;border-radius:12px;background:var(--heat);color:#fff;display:grid;place-items:center;flex:none;}
.resume b{display:block;font-size:14.5px;}
.resume small{color:var(--ink-2);font-size:12.5px;}
.resume .go{margin-left:auto;color:var(--heat);font-weight:800;font-size:13px;display:flex;align-items:center;gap:2px;white-space:nowrap;}

/* course */
.course{position:relative;display:flex;flex-direction:column;gap:12px;}
.course::before{content:"";position:absolute;left:31px;top:30px;bottom:30px;border-left:2px dotted color-mix(in srgb,var(--gold) 55%,transparent);}
.stage{position:relative;display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);transition:transform .12s;}
.stage:active{transform:scale(.985);}
.stage.locked{background:var(--surface-2);box-shadow:none;}
.stage.locked .st-body,.stage.locked .medal{filter:grayscale(.8);opacity:.6;}
.medal{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--heat);color:#fff;font:700 15px/1 var(--f-serif);box-shadow:0 0 0 4px var(--surface),0 0 0 5px color-mix(in srgb,var(--heat) 40%,transparent);position:relative;z-index:1;}
.stage.done .medal{background:var(--good);}
.st-body{flex:1;min-width:0;}
.st-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.st-name{font:700 17px/1.3 var(--f-serif);}
.peps{display:inline-flex;}
.peps .icon{width:13px;height:13px;fill:var(--heat);stroke:none;}
.peps .icon.off{fill:var(--line-2);}
.st-desc{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.45;}
.st-meta{display:flex;gap:10px;margin-top:6px;font-size:11.5px;color:var(--ink-3);font-weight:600;}
.st-meta span{display:inline-flex;align-items:center;gap:3px;}
.st-meta .icon{width:13px;height:13px;}
.st-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.pill.go{background:var(--heat);color:#fff;}
.pill.pass{background:var(--good-soft);color:var(--good);}
.pill.retry{background:var(--surface-2);color:var(--ink-2);}
.pill.ing{background:var(--heat-soft);color:var(--heat);}
.pill.lock{color:var(--ink-3);padding:4px 0;}
.pill .icon{width:13px;height:13px;}
.st-best{font-size:11.5px;color:var(--ink-3);font-weight:600;}

/* podium & ranking */
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:8px;padding:18px 12px 0;}
.pod{text-align:center;min-width:0;}
.pod .av{width:46px;height:46px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;position:relative;}
.pod.p1 .av{width:58px;height:58px;font-size:21px;background:linear-gradient(135deg,#f1d894,#b08a45);color:#3a2a0c;}
.pod.p2 .av{background:linear-gradient(135deg,#d9dfe4,#8f9aa3);color:#26303a;}
.pod.p3 .av{background:linear-gradient(135deg,#e7b48c,#a86a3d);color:#3a1f0c;}
.pod .crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:#d4ab52;}
.pod .crown .icon{width:22px;height:22px;}
.pod .nm{font-weight:700;font-size:13.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pod .sc{font:700 18px/1.2 var(--f-serif);color:var(--gold);}
.pod .base{margin-top:8px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 60%,var(--line)));display:grid;place-items:center;font:700 22px/1 var(--f-serif);color:var(--ink-3);}
.pod.p1 .base{height:76px;background:linear-gradient(180deg,var(--gold-soft),color-mix(in srgb,var(--gold-soft) 70%,var(--gold)));color:var(--gold);}
.pod.p2 .base{height:56px;}.pod.p3 .base{height:42px;}
.pod.empty .av{background:var(--surface-2);color:var(--ink-3);}
.lb{overflow:hidden;}
.lb-row{display:flex;align-items:center;gap:11px;padding:11px 14px;}
.lb-row+.lb-row{border-top:1px solid var(--line);}
.lb-row.me{background:var(--gold-soft);}
.lb-pos{width:24px;text-align:center;font-weight:800;font-size:14px;color:var(--ink-3);flex:none;}
.lb-av{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--ink-2);flex:none;}
.lb-name{flex:1;min-width:0;}
.lb-name b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-name small{display:block;font-size:11.5px;color:var(--ink-3);}
.lb-tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--forest);color:#fff;margin-left:4px;vertical-align:2px;}
.lb-tag.wait{background:var(--surface-2);color:var(--ink-3);}
.lb-stages{display:flex;gap:4px;flex:none;}
.lb-stages i{font-style:normal;font-size:11px;font-weight:700;min-width:26px;text-align:center;padding:2px 0;border-radius:6px;background:var(--surface-2);color:var(--ink-3);}
.lb-stages i.ok{background:var(--good-soft);color:var(--good);}
.lb-score{font:700 17px/1 var(--f-serif);min-width:40px;text-align:right;flex:none;}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:600;}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent);}
.live.off i{background:var(--ink-3);box-shadow:none;}
.empty{text-align:center;color:var(--ink-3);padding:26px 16px;font-size:14px;}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-in{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h);}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink-3);}
.nav button .icon{width:23px;height:23px;}
.nav button.on{color:var(--forest-3);}
.nav button.on .icon{stroke-width:2.2;}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label,.field .lbl{font-size:13px;font-weight:700;color:var(--ink-2);}
.field input,.field select,.field textarea,.inp{width:100%;min-width:0;background:var(--surface);border:1.5px solid var(--line-2);border-radius:12px;padding:12px 13px;font-size:15.5px;}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent);}
.field textarea{min-height:80px;resize:vertical;line-height:1.5;}
.field .sub{font-size:12px;color:var(--ink-3);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips label{position:relative;}
.chips input{position:absolute;opacity:0;pointer-events:none;}
.chips span{display:inline-block;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;}
.chips input:checked+span{background:var(--forest);border-color:var(--forest);color:#fff;}
.err{color:var(--red);font-size:13px;margin:-6px 0 12px;}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:14px;}
.check input{width:20px;height:20px;accent-color:var(--forest);}
.page-h{margin:18px 2px 14px;}
.page-h h1{font:700 23px/1.3 var(--f-serif);}
.page-h p{color:var(--ink-2);font-size:14px;margin-top:5px;}

/* quiz */
.qhead{display:flex;align-items:center;gap:8px;margin-top:6px;}
.stag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--heat);background:var(--heat-soft);padding:4px 10px;border-radius:999px;white-space:nowrap;}
.stag .icon{width:13px;height:13px;}
.qcount{font-weight:700;font-size:13px;color:var(--ink-3);}
.qcount b{font:700 20px/1 var(--f-serif);color:var(--ink);}
.streak{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:13px;color:var(--medium);}
.streak .icon{width:17px;height:17px;}
.streak.pop{animation:pop .5s ease;}
.bar{margin-top:10px;height:6px;border-radius:99px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--forest-3),var(--gold));transition:width .4s ease;}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2);}
.dots i.ok{background:var(--good);}.dots i.no{background:var(--red);}.dots i.now{background:var(--ink);transform:scale(1.2);}
.timer{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink-2);}
.timer .icon{width:17px;height:17px;}
.ttrack{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden;}
.ttrack i{display:block;height:100%;border-radius:99px;background:var(--heat);transition:width .2s linear;}
.ttrack i.warn{background:var(--red);}
.timer b{font-weight:800;font-size:14px;min-width:34px;text-align:right;}
.qcard{position:relative;margin-top:12px;padding:18px 16px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);}
.qcard::before{content:"";position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--heat);}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.qno{font:700 15px/1 var(--f-serif);color:var(--red);}
.qcat{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface-2);padding:3px 9px;border-radius:999px;}
.diff{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-3);font-weight:600;}
.diff i{width:6px;height:6px;border-radius:50%;background:var(--line-2);}
.diff i.on{background:var(--heat,var(--gold));}
.qmeta{padding-right:58px;}
.qtext{font:700 19px/1.6 var(--f-serif);margin-top:10px;text-wrap:wrap;}
.qquote{display:block;margin-top:10px;padding:10px 12px;border-left:3px solid var(--heat,var(--gold));background:var(--surface-2);border-radius:0 10px 10px 0;font:700 17px/1.6 var(--f-serif);color:var(--ink);}
.blank{display:inline-block;width:3.2em;height:1em;margin:0 .15em;border-bottom:2px solid var(--heat,var(--gold));vertical-align:-.1em;}
.rv .qquote,.qrow .qquote{font-size:14.5px;padding:8px 10px;margin-top:6px;}
.stamp{position:absolute;top:6px;right:8px;width:58px;height:58px;pointer-events:none;}
.stamp path{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw .55s ease-out forwards;opacity:.9;}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);font-size:15px;line-height:1.5;transition:border-color .12s,background .12s,transform .1s;}
.opt:not(:disabled):active{transform:scale(.985);}
.opt:not(:disabled):hover{border-color:var(--gold);}
.opt .mk{font:18px/1.35 var(--f-serif);color:var(--ink-3);flex:none;width:20px;}
.opt:disabled{cursor:default;}
.opt.correct{border-color:var(--good);background:var(--good-soft);}
.opt.correct .mk{color:var(--good);font-weight:700;}
.opt.wrong{border-color:var(--red);background:var(--red-soft);}
.opt.wrong .mk{color:var(--red);}
.opt.dim{opacity:.45;}
.opts.ox{flex-direction:row;}
.opts.ox .opt{flex:1;flex-direction:column;align-items:center;gap:2px;padding:14px 10px;min-height:96px;}
.oxm{width:46px;height:46px;}
.oxm circle,.oxm path{fill:none;stroke-width:9;stroke-linecap:round;}
.oxm.o circle{stroke:#3572b0;}.oxm.x path{stroke:var(--red);}
.opts.ox small{font-size:12.5px;color:var(--ink-3);font-weight:700;}
.fb{margin-top:12px;border-radius:18px;padding:14px 16px;border:1px solid;animation:rise .3s ease;}
.fb.right{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent);}
.fb.wrong{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent);}
.fb-h{font:32px/1 var(--f-hand);}
.fb.right .fb-h{color:var(--good);}.fb.wrong .fb-h{color:var(--red);}
.fb-a{font-size:13.5px;font-weight:700;margin-top:6px;}
.fb-e{margin-top:4px;color:var(--ink-2);font-size:14px;}
.fb .btn{margin-top:12px;width:100%;}
.combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:90;pointer-events:none;text-align:center;animation:combo 1.3s ease forwards;}
.combo b{display:block;font:64px/1 var(--f-hand);color:var(--medium);text-shadow:0 2px 0 var(--surface);}
.combo span{font-weight:800;color:var(--ink);background:var(--surface);padding:4px 12px;border-radius:999px;box-shadow:var(--shadow);font-size:13.5px;}

/* certificate */
.cert{position:relative;margin-top:14px;padding:22px 18px 20px;border-radius:22px;background:
  radial-gradient(420px 200px at 100% 0%,color-mix(in srgb,var(--gold-soft) 90%,transparent),transparent 70%),var(--ivory);
  border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);box-shadow:var(--shadow-lg);overflow:hidden;}
.cert::before{content:"";position:absolute;inset:7px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:17px;pointer-events:none;}
.cert-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.cert-eb{font-size:10.5px;letter-spacing:.2em;font-weight:800;color:var(--gold);}
.cert-name{font:700 22px/1.3 var(--f-serif);margin-top:6px;}
.cert-name small{font:500 13px var(--f-body);color:var(--ink-3);margin-left:6px;}
.cert-date{font-size:11.5px;color:var(--ink-3);text-align:right;}
.offi{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--forest);color:#fff;}
.offi.prac{background:var(--surface-2);color:var(--ink-2);}
.cert-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
.score{position:relative;font:86px/1 var(--f-hand);color:var(--red);padding:8px 14px 4px 4px;}
.score span{font-size:38px;}
.score svg{position:absolute;inset:-4px -10px -8px -12px;width:calc(100% + 22px);height:calc(100% + 12px);}
.score svg path{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .9s .2s ease-out forwards;opacity:.8;}
.rseal{width:100px;height:100px;border-radius:50%;flex:none;display:grid;place-items:center;text-align:center;position:relative;background:radial-gradient(circle at 35% 30%,#f5e3b5,#c49c55 70%);color:#3a2a0c;transform:rotate(-8deg);animation:sealIn .5s .5s ease both;box-shadow:0 10px 22px -10px rgba(120,90,30,.8);}
.rseal::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(58,42,12,.45);}
.rseal small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.15em;opacity:.75;}
.rseal b{display:block;font:700 14.5px/1.2 var(--f-serif);margin-top:3px;padding:0 10px;}
.passmark{position:absolute;top:58px;right:18px;transform:rotate(12deg);border:3px solid var(--red);color:var(--red);border-radius:10px;padding:0 10px;font:30px/1.15 var(--f-hand);opacity:.85;animation:sealIn .5s .9s ease both;}
.rmsg{margin-top:10px;font-size:14.5px;font-weight:600;}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center;}
.mini b{display:block;font:700 17px/1.2 var(--f-serif);}
.mini span{font-size:11.5px;color:var(--ink-3);}
.bars{display:flex;flex-direction:column;gap:9px;}
.brow{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;}
.brow .l{color:var(--ink-2);font-weight:600;line-height:1.3;}
.btrack{height:8px;border-radius:99px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden;}
.btrack i{display:block;height:100%;border-radius:99px;background:var(--forest-3);}
.btrack i.low{background:var(--red);}.btrack i.mid{background:var(--gold);}
.brow .v{font-weight:700;font-size:12.5px;min-width:44px;text-align:right;}
.subh{font-size:12.5px;font-weight:800;color:var(--ink-3);margin:18px 0 10px;letter-spacing:.03em;}
.unlock{text-align:center;font:28px/1.2 var(--f-hand);color:var(--hot);margin:16px 0 8px;}
.status{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;}
.status .icon{color:var(--good);}
.status.wait .icon{color:var(--ink-3);}

/* history */
.hrow{display:flex;align-items:center;gap:12px;padding:12px 14px;}
.hrow+.hrow{border-top:1px solid var(--line);}
.hrow .l{flex:1;min-width:0;}
.hrow b{font-size:14.5px;}
.hrow small{display:block;font-size:12px;color:var(--ink-3);}
.hrow .s{font:700 18px/1 var(--f-serif);}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;}
.rv-top{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap;}
.rv h3{font:700 15.5px/1.6 var(--f-serif);margin-top:6px;}
.rv .ln{font-size:14px;margin-top:4px;}
.rv .mine{color:var(--red);}.rv .ok{color:var(--good);}
.rv .ex{margin-top:8px;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:9px 11px;}
.tabs-s{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.tabs-s button{border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2);}
.tabs-s button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);}

/* menu */
.menu{overflow:hidden;}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:none;text-align:left;text-decoration:none;color:var(--ink);}
.mi+.mi{border-top:1px solid var(--line);}
.mi .ic{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--forest-3);flex:none;}
.mi b{display:block;font-size:15px;}
.mi small{display:block;font-size:12.5px;color:var(--ink-3);}
.mi .chev{margin-left:auto;color:var(--ink-3);}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rk{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);}
.rk b{display:block;font:700 15px/1.3 var(--f-serif);}
.rk small{font-size:12px;color:var(--ink-3);}
.rk .n{font-weight:800;font-size:12px;color:var(--gold);}

/* admin */
.atabs{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px;margin-top:12px;}
.atabs button{flex:1;border:0;background:none;border-radius:11px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--ink-2);}
.atabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.callout{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:13.5px;background:var(--gold-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);}
.callout.bad{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent);}
.callout code,.guide code{font-size:12px;background:var(--surface);padding:1px 5px;border-radius:5px;}
.callout pre,.guide pre{white-space:pre-wrap;font-size:11.5px;background:var(--surface);padding:10px;border-radius:10px;margin:8px 0 0;overflow-x:auto;}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;}
.tile span{font-size:12px;color:var(--ink-3);font-weight:600;}
.tile b{display:block;font:700 21px/1.2 var(--f-serif);margin-top:2px;}
.list{display:flex;flex-direction:column;gap:6px;}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;gap:10px;align-items:center;}
.row .m{flex:1;min-width:0;}
.row .m b{font-size:14px;}
.row .m small{display:block;color:var(--ink-3);font-size:12px;}
.row .m p{font-size:14px;margin-top:2px;}
.spill{font-weight:800;font-size:14px;color:var(--red);white-space:nowrap;}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);}
.tg.warn{background:var(--red-soft);color:var(--red);}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none;}
.ibtn .icon{width:17px;height:17px;}
.ibtn.del:hover{color:var(--red);border-color:var(--red);}
.qrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;}
.qrow-t{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.qrow-t .act{margin-left:auto;display:flex;gap:5px;}
.qrow p{font:700 14.5px/1.55 var(--f-serif);margin-top:5px;}
.qrow .an{font-size:13px;color:var(--good);margin-top:3px;font-weight:600;}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl th{font-size:11.5px;color:var(--ink-3);font-weight:700;background:var(--surface-2);}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;}
.tbl td.ok{color:var(--good);font-weight:700;}
.tbl small{color:var(--ink-3);}
.guide h3{font-size:15px;margin:16px 0 6px;}
.guide p,.guide li{font-size:14px;color:var(--ink-2);}
.guide ol,.guide ul{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:5px;}
.dirty{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--forest-2);color:#fdfaf1;}
.dirty-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:10px;}
.dirty-in span{flex:1;font-size:13.5px;}

/* modal & toast */
.mback{position:fixed;inset:0;z-index:100;background:rgba(8,20,15,.55);display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:var(--maxw);max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease;}
.sheet h2{font:700 19px/1.3 var(--f-serif);margin-bottom:14px;}
.sheet .msg{color:var(--ink-2);margin-bottom:16px;}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--forest-2);color:#fdfaf1;padding:11px 18px;border-radius:999px;font-size:14px;max-width:90vw;text-align:center;box-shadow:var(--shadow-lg);}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:110;}

@media (min-width:760px){
  body{background:radial-gradient(900px 500px at 50% -200px,color-mix(in srgb,var(--forest) 22%,transparent),transparent),var(--bg);}
  #app{box-shadow:0 0 0 1px var(--line),0 40px 80px -40px rgba(16,40,30,.4);background:var(--bg);}
  .hero{margin:0 -16px;}
}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes rise{from{opacity:.4;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes up{from{transform:translateY(24px);opacity:.6;}to{transform:none;opacity:1;}}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
@keyframes sealIn{from{transform:rotate(-8deg) scale(1.6);opacity:0;}to{transform:rotate(-8deg) scale(1);opacity:1;}}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-30%) scale(.6);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}75%{opacity:1;transform:translate(-50%,-55%) scale(1);}100%{opacity:0;transform:translate(-50%,-70%) scale(1);}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important;}.stamp path,.score svg path{stroke-dashoffset:0;}}
@media (max-width:360px){.hero h1{font-size:34px;}.qtext{font-size:17.5px;}.score{font-size:72px;}.rseal{width:88px;height:88px;}}

</style>

/* ---------- quiz flow ---------- */
function spread(list,k){var by={},order=[];list.forEach(function(q){if(!by[q.cat]){by[q.cat]=[];order.push(q.cat);}by[q.cat].push(q);});order=shuffle(order);var out=[];
  while(out.length<k){var added=false;for(var i=0;i<order.length&&out.length<k;i++){var b=by[order[i]];if(b.length){out.push(b.shift());added=true;}}if(!added)break;}return out;}
function pickQuestions(sid){
  var st=stageById(sid),mix=st.mix||{1:.3,2:.45,3:.25},pool=shuffle(poolOf(sid)),n=countOf(sid),byD={1:[],2:[],3:[]};
  pool.forEach(function(q){byD[dOf(q)].push(q);});
  var t1=Math.round(n*(+mix[1]||0)),t3=Math.round(n*(+mix[3]||0)),target={1:t1,3:t3,2:Math.max(0,n-t1-t3)},chosen=[];
  [3,2,1].forEach(function(d){chosen=chosen.concat(spread(byD[d],target[d]));});
  [3,2,1].forEach(function(d){if(chosen.length<n)chosen=chosen.concat(spread(byD[d].filter(function(q){return chosen.indexOf(q)<0;}),n-chosen.length));});
  var ordered=[];[1,2,3].forEach(function(d){ordered=ordered.concat(shuffle(chosen.filter(function(q){return dOf(q)===d;})));});
  return ordered.map(function(q){var idx=q.opts.map(function(_,i){return i;});return{q:q,order:q.type==="ox"?idx:shuffle(idx)};});
}
function tryStage(sid){

  var i=stageIdx(sid);if(i<0)return;
  if(!unlocked(i)){toast("'"+stages()[i-1].name+"'을(를) "+passScore()+"점 이상으로 통과하면 열려요.");return;}
  if(!poolOf(sid).length){toast("이 단계에는 아직 문항이 없어요.");return;}
  if(!S.player.name){S.pendingStage=sid;go("entry");return;}
  startRun(sid);
}

function enterQuestion(){var r=S.run;if(r&&r.picked===null&&r.limit>0&&!r.deadline){r.deadline=Date.now()+r.limit*1000;saveRun();}}
var CHEERS_OK=["정답!","딩동댕!","역시!","완벽해요!","잘 알고 있네요!"],CHEERS_NO=["아쉬워요!","앗, 아깝다!","괜찮아요, 배우면 돼요","다음엔 맞힐 거예요"];

  var r=S.run;if(!r||r.picked!==null)return;
  var it=r.items[r.idx],timeout=i===-1,ok=!timeout&&i===it.q.ans;
  r.picked=i;r.deadline=null;r.answers.push({qid:it.q.id,cat:it.q.cat,d:dOf(it.q),pick:timeout?null:i,ok:ok});
  if(ok){r.streak++;r.best=Math.max(r.best,r.streak);}else r.streak=0;
  r.cheer=timeout?"시간 초과!":(ok?CHEERS_OK:CHEERS_NO)[Math.floor(Math.random()*(ok?CHEERS_OK:CHEERS_NO).length)];
  saveRun();render();

  var fb=document.getElementById("fb-next");if(fb){fb.focus({preventScroll:true});var box=document.querySelector(".fb");if(box&&box.scrollIntoView)box.scrollIntoView({behavior:REDUCED?"auto":"smooth",block:"nearest"});}
}

var tickT=null;
function tick(){clearInterval(tickT);tickT=setInterval(function(){
  var r=S.run;if(S.screen!=="quiz"||!r||r.picked!==null||!r.deadline){clearInterval(tickT);return;}
  var left=r.deadline-Date.now(),bar=document.getElementById("tbar"),tx=document.getElementById("tsec");

function finish(){

  var t=r.answers.length,s=t?Math.round(c/t*100):0,rk=rankFor(s),wasUnlocked=stages().map(function(_,i){return unlocked(i);});
  var prog=progress(),p=prog[r.stage]||{tries:0},official=!officialOf(r.stage),now=new Date().toISOString();
  var res={v:3,st:r.stage,n:S.player.name,g:S.player.group||"",d:now,s:s,c:c,t:t,bs:r.best,ms:Date.now()-r.t0,k:rk.r.name,cat:cat,dd:dd,o:official?1:0,a:r.answers.map(function(a){return[a.qid,a.ok?1:0,a.pick];})};
  p.tries=(p.tries||0)+1;if(official)p.first={s:s,c:c,t:t,d:now};if(!p.best||s>p.best.s)p.best={s:s,d:now};prog[r.stage]=p;lsSet("gtq_prog2",prog);
  var h=history();h.unshift(res);lsSet("gtq_hist",h.slice(0,60));
  var ni=stageIdx(r.stage)+1;res.newUnlock=ni<stages().length&&!wasUnlocked[ni]&&unlocked(ni)?stages()[ni].id:null;
  S.run=null;saveRun();S.result=res;S.reviewOf=res;S.reviewFilter="wrong";S.copyText=null;

}

/* ---------- ranking ---------- */
function boardRows(){
  var rows=(BOARD.rows||[]).map(function(r){return{n:r.n,g:r.g||"",sc:Object.assign({},r.sc),me:false,wait:false};});
  if(S.player.name){
    var me={n:S.player.name,g:S.player.group||""},mine={},any=false;
    stages().forEach(function(s){var f=officialOf(s.id);if(f){mine[s.id]=f.s;any=true;}});
    if(any){var hit=null;rows.forEach(function(r){if(r.n===me.n&&(r.g||"")===me.g)hit=r;});
      if(!hit){hit={n:me.n,g:me.g,sc:{},me:true};rows.push(hit);}
      hit.me=true;Object.keys(mine).forEach(function(k){if(hit.sc[k]==null){hit.sc[k]=mine[k];hit.wait=true;}});}
  }
  return rows;
}
function sortedRows(tab){
  var rows=boardRows().filter(function(r){return tab==="all"?Object.keys(r.sc).length:r.sc[tab]!=null;});
  var key=function(r){return tab==="all"?totalOf(r.sc):r.sc[tab];};
  rows.sort(function(a,b){return key(b)-key(a)||Object.keys(b.sc).length-Object.keys(a.sc).length||a.n.localeCompare(b.n);});
  var pos=0,prev=null;rows.forEach(function(r,i){var k=key(r);if(k!==prev){pos=i+1;prev=k;}r.pos=pos;r.key=k;});return rows;
}
function podium(rows){
  var p=[rows[1],rows[0],rows[2]],cls=["p2","p1","p3"],lab=["2","1","3"];
  return'<div class="podium">'+p.map(function(r,i){if(!r)return'<div class="pod '+cls[i]+' empty"><div class="av">?</div><div class="nm">&nbsp;</div><div class="sc">&nbsp;</div><div class="base">'+lab[i]+'</div></div>';
    return'<div class="pod '+cls[i]+'"><div class="av">'+(cls[i]==="p1"?'<span class="crown">'+ic("crown","fill")+'</span>':'')+esc(initial(r.n))+'</div><div class="nm">'+esc(r.n)+(r.me?' <span class="lb-tag">나</span>':'')+'</div><div class="sc num">'+r.key+'</div><div class="base">'+lab[i]+'</div></div>';}).join("")+'</div>';
}
function lbRow(r,tab){
  var sts=tab==="all"?'<span class="lb-stages">'+stages().map(function(s){var v=r.sc[s.id];return'<i class="'+(v!=null&&v>=passScore()?"ok":"")+'" title="'+esc(s.name)+'">'+(v==null?"·":v)+'</i>';}).join("")+'</span>':"";

var app=document.getElementById("app");

function render(toTop){
  if(S.screen==="quiz"&&!S.run)S.screen="home";
  if((S.screen==="result"&&!S.result)||(S.screen==="review"&&!S.reviewOf))S.screen="home";
  var isTab=["home","rank","mine","more"].indexOf(S.screen)>=0,h="";
  if(!isTab&&S.screen!=="home"){var title=S.screen==="quiz"?(stageById(S.run.stage)||{}).name:TITLES[S.screen]||"";
    h+='<header class="topbar"><div class="topbar-in"><button class="back" data-act="back" aria-label="뒤로">'+ic("back")+'</button><span class="top-title">'+esc(title)+'</span>'+(S.screen==="quiz"?'<span class="top-right">나가도 이어서 풀어요</span>':'')+'</div></header>';}
  var body={home:vHome,rank:vRank,mine:vMine,more:vMore,entry:vEntry,quiz:vQuiz,result:vResult,review:vReview,propose:vPropose,admin:vAdmin}[S.screen]||vHome;
  h+='<main class="page'+(isTab?'':' nonav')+'">'+body()+'</main>';
  if(isTab)h+='<nav class="nav" aria-label="메뉴"><div class="nav-in">'+NAV.map(function(n){return'<button class="'+(S.screen===n[0]?"on":"")+'" data-act="tab" data-t="'+n[0]+'"'+(S.screen===n[0]?' aria-current="page"':'')+'>'+ic(n[2])+n[1]+'</button>';}).join("")+'</div></nav>';
  if(S.dirty&&S.screen==="admin")h+='<div class="dirty"><div class="dirty-in"><span>저장하지 않은 변경사항이 있어요.</span><button class="btn btn-sm btn-gold" data-act="save">저장하기</button></div></div>';

function exportCsv(){
  var rs=((S.admin&&S.admin.results)||[]).filter(function(r){return S.aStage==="all"||r.st===S.aStage;});if(!rs.length){toast("저장할 결과가 없어요.");return;}
  var cq=function(v){v=String(v==null?"":v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;},pct=function(v){return v?Math.round(v[0]/v[1]*100):"";};
  var head=["이름","소속","단계","구분","점수","통과","정답","문항수","등급","쉬움(%)","보통(%)","어려움(%)","최고연속","걸린시간(초)","일시"];
  var rows=rs.map(function(r){var dd=r.dd||{};return[r.n,r.g,shortName(r.st),r.o===0?"연습":"공식",r.s,r.s>=passScore()?"O":"",r.c,r.t,rankFor(r.s).r.name,pct(dd[1]),pct(dd[2]),pct(dd[3]),r.bs,Math.round((r.ms||0)/1000),fmtDate(r.d)];});
  var dt=new Date();download("GT퀴즈_결과_"+dt.getFullYear()+pad2(dt.getMonth()+1)+pad2(dt.getDate())+".csv","﻿"+[head].concat(rows).map(function(r){return r.map(cq).join(",");}).join("\n"),"text/csv;charset=utf-8");
}

    case"q-new":{var fc=S.qFilter!=="all"?DATA.cats.filter(function(c){return c.stage===S.qFilter;})[0]:null;S.formErr="";S.modal={type:"qedit",isNew:true,q:{id:uid("q"),cat:(fc||DATA.cats[0]||{}).id,d:2,type:"mc",q:"",opts:["","","",""],ans:0,exp:""}};render();break;}
    case"q-edit":{var q=findQ(el.getAttribute("data-q"));if(!q)break;S.formErr="";S.modal={type:"qedit",isNew:false,q:JSON.parse(JSON.stringify(q))};render();break;}
    case"q-del":{var qid=el.getAttribute("data-q"),qq=findQ(qid);confirmBox("이 문항을 삭제할까요?",qq?qq.q:"","삭제",function(){DATA.questions=DATA.questions.filter(function(x){return x.id!==qid;});markDirty();});break;}
    case"cats":S.formErr="";S.modal={type:"cats",cats:DATA.cats.map(function(c){return{id:c.id,name:c.name,stage:c.stage||(stages()[0]||{}).id};})};render();break;
    case"cat-add":catsFromForm();S.modal.cats.push({id:uid("c"),name:"",stage:S.qFilter!=="all"?S.qFilter:(stages()[0]||{}).id});render();break;
    case"cat-del":catsFromForm();S.modal.cats.splice(+el.getAttribute("data-i"),1);render();break;
    case"m-close":S.modal=null;S.formErr="";render();break;
    case"m-yes":{var fn=S.modal&&S.modal.onYes;S.modal=null;if(fn)fn();render();break;}
    case"save":saveAll();break;
  }
});
function removeProposal(pid){
  if(db&&!(S.admin&&S.admin.local)){col("proposals").doc(pid).delete().catch(fbFail);}
  else{var b=inbox();b.proposals=b.proposals.filter(function(x){return x.pid!==pid;});saveInbox(b);}
  if(S.admin)S.admin.proposals=(S.admin.proposals||[]).filter(function(x){return x.pid!==pid;});render();
}
app.addEventListener("change",function(ev){var t=ev.target;if(!t.hasAttribute("data-retype"))return;
  var px=t.getAttribute("data-retype"),cur=readQ(px);cur.type=t.value;if(cur.type==="ox"){cur.opts=["O","X"];if(cur.ans>1)cur.ans=0;}else{cur.opts=["","","",""];cur.ans=0;}
  if(px==="pp"){cur.by=(document.getElementById("pp-by")||{}).value||"";S.proposal=cur;}else{cur.id=S.modal.q.id;S.modal.q=cur;}render();});
app.addEventListener("submit",function(ev){
  ev.preventDefault();var f=ev.target;
  if(f.id==="pin-form"){var pv=document.getElementById("pin-input").value.trim();
    if(DATA.meta.pinHash&&pinHash(pv)===DATA.meta.pinHash){S.pinOk=true;lsSet("gtq_admin",DATA.meta.pinHash);S.modal=null;go("admin");loadAdmin();toast("관리자 모드로 들어왔어요.");}
    else{S.formErr="비밀번호가 맞지 않아요.";render();var pi=document.getElementById("pin-input");if(pi)pi.focus();}}
  else if(f.id==="entry-form"){var name=document.getElementById("f-name").value.trim();
    if(!name){S.formErr="이름을 적어 주세요.";render();document.getElementById("f-name").focus();return;}
    S.player={name:name,group:document.getElementById("f-group").value.trim()};lsSet("gtq_player",S.player);S.formErr="";
    var ps=S.pendingStage;S.pendingStage=null;if(ps)startRun(ps);else{go(S.tab);toast("저장했어요.");}}
  else if(f.id==="propose-form"){var p=readQ("pp");p.by=document.getElementById("pp-by").value.trim();S.proposal=p;
    var err=validQ(p);if(err){S.formErr=err;render();return;}p=compactOpts(JSON.parse(JSON.stringify(p)));S.formErr="";
    var ans=p.type==="ox"?(p.ans===0?"O":"X"):p.opts[p.ans],lines=["[GT 퀴즈 문제 제안]",shortName(stageOfQ(p))+" · "+catName(p.cat)+" · "+DLABEL[p.d],"문제: "+p.q];
    if(p.type!=="ox")p.opts.forEach(function(o,i){lines.push(MK[i]+" "+o);});lines.push("정답: "+ans);if(p.exp)lines.push("해설: "+p.exp);lines.push("출제: "+(p.by||"익명"));
    var payload={cat:p.cat,d:p.d,type:p.type,q:p.q,opts:p.opts,ans:p.ans,exp:p.exp,by:p.by};
    if(db){toast("보내는 중…");col("proposals").add(Object.assign({},payload,{opts:JSON.stringify(p.opts),at:FV.serverTimestamp()})).then(function(){S.proposal=null;go("more");toast("제안을 보냈어요. 고마워요!");}).catch(function(e){fbFail(e);lines.push("","GTQP:"+toUrl(JSON.stringify(payload)));copyText(lines.join("\n"),"전송이 안 돼서 복사했어요. 카톡으로 보내 주세요.");});}
    else{lines.push("","GTQP:"+toUrl(JSON.stringify(payload)));copyText(lines.join("\n"),"제안을 복사했어요. 간사님께 보내 주세요!");}}
  else if(f.id==="qedit-form"){var md=S.modal,q=readQ("qe");q.id=md.q.id;var e2=validQ(q);if(e2){md.q=q;S.formErr=e2;render();return;}
    q=compactOpts(q);q.stage=stageOfQ(q);S.formErr="";var i=-1;DATA.questions.forEach(function(x,j){if(x.id===q.id)i=j;});if(i>=0)DATA.questions[i]=q;else DATA.questions.push(q);
    if(md.fromProposal)removeProposal(md.fromProposal);S.modal=null;markDirty();render();toast("저장했어요. 아래 [저장하기]로 반영해 주세요.");}
  else if(f.id==="cats-form"){catsFromForm();var cs=S.modal.cats.filter(function(c){return c.name.trim();}).map(function(c){return{id:c.id,name:c.name.trim(),stage:c.stage};});
    var used={};DATA.questions.forEach(function(q){used[q.cat]=1;});if(Object.keys(used).some(function(id){return!cs.some(function(c){return c.id===id;});})){toast("문항이 있는 영역의 이름은 비워 둘 수 없어요.");return;}
    DATA.cats=cs;DATA.questions.forEach(function(q){q.stage=stageOfQ(q);});S.modal=null;markDirty();render();}
  else if(f.id==="settings-form"){var m=DATA.meta,g=function(id){return document.getElementById(id).value;};
    m.title=g("s-title").trim()||"GT 퀴즈";m.tagline=g("s-tag").trim();m.passScore=Math.max(0,Math.min(100,parseInt(g("s-pass"),10)||60));m.studyUrl=g("s-url").trim();m.lockStages=document.getElementById("s-lock").checked;
    stages().forEach(function(s,i){s.name=g("s-sn-"+i).trim()||s.name;s.count=Math.max(1,Math.min(100,parseInt(g("s-sc-"+i),10)||10));s.timer=Math.max(0,Math.min(300,parseInt(g("s-st-"+i),10)||0));s.desc=g("s-sd-"+i).trim();});
    m.ranks=ranksSorted().map(function(r,i){return{min:Math.max(0,Math.min(100,parseInt(g("s-rmin-"+i),10)||0)),name:g("s-rname-"+i).trim()||r.name,msg:g("s-rmsg-"+i).trim()};});m.ranks[m.ranks.length-1].min=0;
    var np=g("s-pin").trim();if(np){if(!/^\d{4,8}$/.test(np)){toast("비밀번호는 숫자 4~8자리로 적어 주세요.");return;}m.pinHash=pinHash(np);S.newPinHash=m.pinHash;}
    markDirty();render();toast("적용했어요. 아래 [저장하기]로 반영해 주세요.");}
});
document.addEventListener("keydown",function(ev){
  if(S.modal){if(ev.key==="Escape"){S.modal=null;S.formErr="";render();}return;}
  if(S.screen!=="quiz"||!S.run)return;var tag=(ev.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea"||tag==="select")return;
  var r=S.run,it=r.items[r.idx];
  if(r.picked===null){if(it.q.type==="ox"){if(/^[oO1]$/.test(ev.key))pick(0);else if(/^[xX2]$/.test(ev.key))pick(1);}else{var n=parseInt(ev.key,10);if(n>=1&&n<=it.order.length)pick(it.order[n-1]);}}
  else if(ev.key==="Enter"&&ev.target.id!=="fb-next"){ev.preventDefault();next();}
});
document.addEventListener("visibilitychange",function(){if(!document.hidden){if(S.screen==="quiz")render();flushQueue();}});
window.addEventListener("online",flushQueue);

/* ---------- boot ---------- */
fbInit();render();
if(db){listenBoard();loadConfig();flushQueue();}
})();

</script>
